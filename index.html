*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font-family:'IYC',Avenir,'Avenir Next','Segoe UI',system-ui,sans-serif;
font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 64px}
.marke{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.marke img{width:132px;height:auto;display:block}
.marke .claim{font-size:11px;letter-spacing:.2em;text-transform:uppercase;
color:var(--gold);border-left:1px solid var(--line);padding-left:14px}
h1{font-weight:800;font-size:31px;letter-spacing:-.02em;margin:0 0 6px;
text-wrap:balance}
h2{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
font-weight:400;margin:0 0 8px}
p{margin:0 0 14px;max-width:60ch;color:var(--dim)}
p b{color:var(--fg);font-weight:400}
button{font-family:inherit;font-size:15px;border-radius:6px;padding:12px 20px;
cursor:pointer;border:1px solid transparent}
button.go{background:var(--gold);color:#1A1A1A;font-weight:800}
button.go:disabled{background:var(--goldd);color:#00000066;cursor:default}
button.ghost{background:none;border-color:var(--line);color:var(--dim)}
button:focus-visible{outline:2px solid var(--goldl);outline-offset:2px}
input[type=text],input[type=email]{background:#111;border:1px solid var(--line);color:var(--fg);
border-radius:6px;padding:13px;font-size:16px;font-family:inherit;width:100%}
input[type=text]:focus-visible,input[type=email]:focus-visible{outline:2px solid var(--goldl);outline-offset:1px}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.mailk input{width:100%;max-width:360px;display:block;margin:0 0 10px}
.nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}
.hint{font-size:12.5px;color:var(--dim)}

/* Bereichsliste beim Anlegen */
.liste{display:flex;flex-direction:column;gap:8px;margin:18px 0}
.zeile{display:flex;align-items:center;gap:10px;background:var(--card);
border:1px solid var(--line);border-radius:8px;padding:11px 14px}
.zeile .n{color:var(--gold);font-variant-numeric:tabular-nums;min-width:20px}
.zeile .t{flex:1}
.zeile button{padding:5px 10px;font-size:13px}
.zeile select{background:#111;border:1px solid var(--line);color:var(--dim);
border-radius:6px;padding:6px 8px;font-family:inherit;font-size:13px}
.zeile select:focus-visible{outline:2px solid var(--goldl);outline-offset:1px}
.zeile select.auto{border-color:var(--goldd);color:var(--goldl)}
.warn{border:1px solid var(--gold);border-left-width:3px;border-radius:8px;
background:#2A2114;padding:14px 16px;margin:0 0 14px;color:var(--fg);max-width:60ch}
.warn b{color:var(--goldl)}
/* Balken fuer die Unterkriterien. Bewusst dieselbe Metapher wie das Rad — fuellen,
   nicht schieben — nur flach, weil ein zweites Rad hier nur ablenken wuerde. */
.uk{display:flex;flex-direction:column;gap:9px;margin:16px 0}
.ukz{display:grid;grid-template-columns:1fr 130px 34px 30px;align-items:center;gap:12px;
background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 13px}
.ukz .nm{font-size:14.5px}
.bar{height:22px;border:1px solid var(--line);border-radius:4px;background:#111;
position:relative;cursor:crosshair;touch-action:none}
.bar i{display:block;height:100%;background:var(--gold);opacity:.82;border-radius:3px}
.bar:focus-visible{outline:2px solid var(--goldl);outline-offset:2px}
.ukz .z{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums;
text-align:right;font-size:16px}
.ukz button{padding:4px 8px;font-size:12px}
.gegen{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;
margin:16px 0}
.gg{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.gg .k{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.gg .p{display:flex;gap:16px;align-items:baseline;margin-top:6px}
.gg .p span{font-variant-numeric:tabular-nums}
.gg .bauch{font-size:20px;color:var(--fg)}
.gg .rech{font-size:20px;color:var(--gold);font-weight:800}
.gg .d{font-size:13px;color:var(--dim);margin-top:5px}
@media(max-width:520px){.ukz{grid-template-columns:1fr 92px 30px 26px;gap:8px}}
.vorschlaege{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 0}
.vorschlaege button{padding:8px 13px;font-size:13.5px;color:var(--dim)}

/* Vertiefung: 100%-Definition, Staerken, Herausforderungen.
   Bewusst Formularzeilen und keine Balken — hier wird geschrieben, nicht geschaetzt.
   Das Gewicht ist ein Auswahlfeld, weil man davon pro Bereich zehn bis zwanzig
   setzt und jede Geste, die laenger dauert als ein Klick, den Durchgang abbricht. */
textarea{background:#111;border:1px solid var(--line);color:var(--fg);border-radius:6px;
padding:13px;font-size:16px;font-family:inherit;width:100%;line-height:1.55;
resize:vertical;min-height:104px}
textarea:focus-visible{outline:2px solid var(--goldl);outline-offset:1px}
h3{font-size:16.5px;font-weight:800;margin:34px 0 4px;color:var(--fg)}
h3 .n{color:var(--gold);margin-right:9px;font-variant-numeric:tabular-nums}
.rowl{display:flex;flex-direction:column;gap:9px;margin:14px 0}
.row{background:var(--card);border:1px solid var(--line);border-radius:8px;
padding:11px 13px;display:flex;flex-direction:column;gap:9px}
.row .kopf{display:grid;grid-template-columns:1fr 104px 30px;gap:10px;align-items:center}
.row input[type=text]{background:#161616;padding:9px 11px;font-size:15px}
.row select{background:#111;border:1px solid var(--line);color:var(--fg);border-radius:6px;
padding:9px 8px;font-family:inherit;font-size:14px;width:100%}
.row select:focus-visible{outline:2px solid var(--goldl);outline-offset:1px}
.row select.unset{border-color:var(--goldd);color:var(--goldl)}
.row input.unset{border-color:var(--goldd)}
.row .sub{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row .sub .f{display:flex;flex-direction:column;gap:4px}
.row .sub label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.row button{padding:4px 9px;font-size:12px}
@media(max-width:520px){.row .kopf{grid-template-columns:1fr 82px 28px;gap:7px}
.row .sub{grid-template-columns:1fr}}
.rang{display:flex;flex-direction:column;gap:8px;margin:18px 0}
.rz{display:grid;grid-template-columns:30px 1fr 50px 78px;align-items:center;gap:12px;
background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 14px}
.rz .p{color:var(--gold);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.rz .nm{font-size:15px}
.rz .ess{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);
border:1px solid var(--goldd);border-radius:10px;padding:2px 8px;margin-left:8px;
white-space:nowrap}
.rz .w{color:var(--gold);font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.rz .pf{display:flex;gap:5px;justify-content:flex-end}
.rz .pf button{padding:4px 10px;font-size:14px;line-height:1}
.rz .pf button:disabled{opacity:.3;cursor:default}
@media(max-width:520px){.rz{grid-template-columns:24px 1fr 40px 70px;gap:8px}
.rz .ess{display:block;margin:3px 0 0}}
.vorl{display:flex;flex-direction:column;gap:7px;margin:16px 0}
.vz{display:grid;grid-template-columns:22px 1fr 34px;align-items:start;gap:11px;
background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 14px;
cursor:pointer}
.vz.an{border-color:var(--gold);background:#241C10}
.vz input{margin:3px 0 0;accent-color:var(--gold);width:16px;height:16px}
.vz .s{font-size:15px;grid-column:2}
.vz .q{font-size:12px;color:var(--dim);grid-column:2;margin-top:2px}
.vz .g{color:var(--gold);font-weight:800;font-size:13px;text-align:right;
font-variant-numeric:tabular-nums}
.empf{border:1px solid var(--gold);border-left-width:3px;border-radius:8px;
background:#241C10;padding:18px 20px;margin:28px 0 8px}
.empf .lb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
display:block;margin-bottom:6px}
.empf .eh{font-size:23px;font-weight:800;letter-spacing:-.01em;margin:0 0 8px;
color:var(--fg);text-wrap:balance}
.empf p{color:#DDD;max-width:58ch}
.empf p.hint{color:var(--dim)}
.tunl{margin:10px 0 4px;padding-left:22px;color:#DDD;max-width:58ch}
.tunl li{margin:0 0 6px}
.tunl li span{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums;
font-size:12.5px;margin-left:6px}
details.auf{border-top:1px solid var(--line);margin:0}
details.auf:last-of-type{border-bottom:1px solid var(--line)}
details.auf summary{cursor:pointer;padding:15px 2px;font-size:14.5px;color:var(--dim);
list-style:none;display:flex;align-items:center;gap:10px}
details.auf summary::-webkit-details-marker{display:none}
details.auf summary::before{content:'+';color:var(--gold);font-weight:800;font-size:17px;
width:14px;display:inline-block}
details.auf[open] summary::before{content:'–'}
details.auf summary:hover{color:var(--fg)}
details.auf > *:not(summary){margin-bottom:20px}
.jump{position:sticky;top:0;z-index:5;display:flex;gap:6px;flex-wrap:wrap;
background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;margin:0 0 18px}
.jb{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:6px;
padding:7px 11px;font-size:12.5px;display:flex;gap:8px;align-items:center;cursor:pointer;
font-family:inherit}
.jb span{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.jb.warn{border-color:var(--goldd)}
.jb.warn span{color:var(--goldl)}
.jb:hover{border-color:var(--goldd)}
h3,#stand{scroll-margin-top:62px}
@media(max-width:520px){.jb{padding:6px 9px;font-size:11.5px;gap:6px}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);
border:1px solid var(--line);border-radius:20px;padding:7px 8px 7px 14px;font-size:14px}
.chip button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:15px;
line-height:1;padding:2px 5px;border-radius:50%}
.chip button:hover{color:var(--goldl)}
.lb2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}
.stand{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);
border-radius:8px;padding:16px 18px;margin:30px 0 0}
.stand .p{display:flex;gap:34px;align-items:flex-end;margin:10px 0 6px}
.stand .lb{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
display:block;margin-bottom:2px}
.stand .bauch{font-size:27px;font-variant-numeric:tabular-nums}
.stand .rech{font-size:27px;color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.stand p{margin:8px 0 0}
.fort{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 20px;
font-size:13px;color:var(--dim);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fort button{padding:5px 11px;font-size:12.5px}
/* Tabellen (Verlauf und Zielvorlage) — die CSS-Klasse wurde am 03.09. benutzt,
   aber nie definiert; die Verlaufstabelle stand deshalb ungestylt da. */
.tab{border-collapse:collapse;width:100%;margin:12px 0;font-size:14.5px}
.tab th{text-align:left;font-weight:400;font-size:11px;letter-spacing:.09em;
text-transform:uppercase;color:var(--dim);padding:7px 10px;border-bottom:1px solid var(--line)}
.tab td{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--dim);
vertical-align:top}
.tab td:first-child{color:var(--fg)}
.tab td.g{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums;
text-align:right;white-space:nowrap}

/* Rad */
.radbox{display:flex;flex-direction:column;align-items:center;gap:6px;margin:8px 0 4px}
svg{touch-action:none;width:100%;max-width:620px;height:auto;display:block;
user-select:none;-webkit-user-select:none}
.seg{cursor:crosshair}
.werte{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
gap:8px;margin-top:20px}
.wert{display:flex;align-items:baseline;gap:10px;background:var(--card);
border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.wert .z{color:var(--gold);font-weight:800;font-size:21px;
font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
.wert .b{font-size:14px;color:var(--dim);flex:1}
.wert.leer .z{color:var(--goldd)}
@media(max-width:520px){.wrap{padding:20px 15px 52px}h1{font-size:26px}}

/* Ordnet die drei essenziellen Bereiche selbst zu: je essenziellem Bereich gewinnt der
   Bereich mit den meisten Treffern, bei Gleichstand das laengste Suchwort — dasselbe
   Verfahren wie bei den Unterkriterien.
   🔴 Ein von Hand gesetzter Wert wird NIE ueberschrieben. Deshalb merkt sich jeder
   Bereich in essAuto, ob die Zuordnung ein Vorschlag ist oder eine Entscheidung. */
function autoZuordnen(){
  bereiche.forEach(b => { if (b.essAuto) { b.ess = null; b.essAuto = false; } });
  const belegt = new Set(bereiche.filter(b => b.ess).map(b => b.ess));
  ESSENZIELL.forEach(e => {
    if (belegt.has(e.id)) return;
    let best = null, bp = 0;
    bereiche.forEach(b => {
      if (b.ess) return;
      const n = b.name.toLowerCase();
      const p = e.kern.filter(w => n.includes(w)).length * 2
              + e.auch.filter(w => n.includes(w)).length;
      if (p > bp){ best = b; bp = p; }
    });
    if (best){ best.ess = e.id; best.essAuto = true; }
  });
}

      <option value=""${b.ess ? '' : ' selected'}>—</option>
      ${ESSENZIELL.map(e => `<option value="${e.id}"${b.ess === e.id ? ' selected' : ''}
        ${belegt(e.id, i) ? ' disabled' : ''}>${e.name}</option>`).join('')}
    </select>
    <button class="ghost" onclick="weg(${i})">entfernen</button></div>`).join('')}
  </div>

  ${!bereiche.length ? '' : (() => {
    const auto = bereiche.filter(b => b.essAuto);
    const kopf = `Drei Bereiche sind in jedem Leben essenziell: <b>Beziehungen,
      Finanzen, Gesundheit</b>. „Finanzen ist nicht alles, aber ohne Finanzen ist alles
      nichts“ — und so für alle drei. Welcher deiner Bereiche welchen davon abdeckt,
      steht im Feld rechts neben dem Namen.`;
    if (fehlend().length)
      return `<div class="warn"><b>Offen: ${fehlend().map(e => e.name).join(', ')}.</b><br>
        ${kopf} <b>Ohne die Zuordnung fällt die Krisenregel aus</b> — der einzige Teil
        der Methode, der eine Warnung ausspricht.${auto.length
          ? `<br>Vorgeschlagen habe ich: ${auto.map(b =>
              `${esc(b.name)} → ${(ESSENZIELL.find(e => e.id === b.ess)||{}).name}`).join(' · ')}.` : ''}</div>`;
    if (auto.length)
      return `<div class="warn">${kopf}<br><b>Ich habe zugeordnet:</b>
        ${auto.map(b => `${esc(b.name)} → ${(ESSENZIELL.find(e => e.id === b.ess)||{}).name}`).join(' · ')}.
        Das sind Vorschläge aus deinen Bereichsnamen — <b>prüf sie</b>, dein Wort kennst
        nur du. Sobald du eins änderst, gilt deine Wahl.</div>`;
    return `<p class="hint" style="margin-top:-6px">Alle drei essenziellen Bereiche sind
      zugeordnet.</p>`;
  })()}

  ${bereiche.length < MAX ? `
  <input type="text" id="neu" maxlength="42" placeholder="Bereich eintragen und Enter"
   onkeydown="if(event.key==='Enter')dazu()">
  <div class="nav" style="margin-top:10px">
    <button class="ghost" onclick="dazu()">Hinzufügen</button>
    <span class="hint">${bereiche.length} von höchstens ${MAX}</span>
  </div>` : `<p class="hint">Acht Bereiche sind genug — mehr macht das Rad unlesbar.</p>`}

  <div style="margin-top:26px">
  ${zeigeVorschlaege ? `
    <p class="hint">Nimm sie nur, wenn eine wirklich passt. Das eigene Wort ist mehr wert.</p>
    <div class="vorschlaege">${VORSCHLAEGE
      .filter(v => !bereiche.some(b => b.name === v))
      .map(v => `<button class="ghost" onclick="dazu(${arg(v)})">+ ${esc(v)}</button>`)
      .join('')}</div>`
    : `<button class="ghost" onclick="zeigeVorschlaege=true;render()">Ich brauche Ideen</button>`}
  </div>

  <div class="nav">
    <button class="go" ${bereiche.length >= MIN ? '' : 'disabled'} onclick="seite=1;render()">Weiter zum Rad</button>
    <span class="hint">${bereiche.length < MIN
      ? `noch ${MIN - bereiche.length} Bereich${MIN-bereiche.length===1?'':'e'}`
      : (fehlend().length ? `${fehlend().length} Zuordnung${fehlend().length===1?'':'en'} offen —
         du kannst trotzdem weiter` : '')}</span>
  </div>`;
  const f = document.getElementById('neu');
  if (f) f.focus();
}

function dazu(name){
  let t = name;
  if (t === undefined){
    const f = document.getElementById('neu');
    t = f ? f.value : '';
  }
  t = String(t).trim().slice(0,42);
  if (!t) return;
  if (bereiche.some(b => b.name.toLowerCase() === t.toLowerCase())) return;
  if (bereiche.length >= MAX) return;
  bereiche.push({name:t, wert:null, ess:null});
  autoZuordnen();
  render();
}
function weg(i){ bereiche.splice(i,1); autoZuordnen(); render(); }
/* Jede essenzielle Rolle kann nur einmal vergeben werden — sonst waere „Beziehungen"
   doppelt abgedeckt und „Gesundheit" gar nicht, ohne dass es auffaellt. */
function belegt(id, ausser){ return bereiche.some((b,j) => j !== ausser && b.ess === id); }
function zuordnen(i, id){
  /* Von Hand gesetzt heisst entschieden — ab hier fasst die Automatik den Bereich
     nicht mehr an. Nimmt der Nutzer eine Zuordnung weg, die ein anderer Bereich
     gebrauchen koennte, darf sie dorthin wandern; deshalb der zweite Lauf. */
  bereiche[i].ess = id || null;
  bereiche[i].essAuto = false;
  autoZuordnen();
  render();
}
function fehlend(){ return ESSENZIELL.filter(e => !bereiche.some(b => b.ess === e.id)); }

/* ============================== Seite 2: Rad ============================== */
const M = 260, R = 210, RI = 22;        // Mittelpunkt, Aussen-, Innenradius
const G = 10;                            // Skala 0..10
/* 🔴 Frank 03.09.2026: „es waere besser, wenn man in 5%er Schritten bewerten koennte.“
   Also halbe Punkte. Ich hatte auf ganze Schritte bestanden, um keine Scheingenauigkeit
   zu behaupten — bei Halben ist die Gefahr gering, und es ist seine Methode.
   Angezeigt wird deutsch mit Komma und nur dann eine Nachkommastelle, wenn es eine gibt:
   7 bleibt 7, aus 7,5 wird nicht 7,50. */
const SCHRITT = 0.5;
const zahl = w => (Math.round(w*2)/2).toFixed(w % 1 === 0 ? 0 : 1).replace('.', ',');

/* Segment vom Innenradius bis zum Radius r als Pfad. */
function segment(i, n, r){
  const a0 = -Math.PI/2 + i * 2*Math.PI/n;
  const a1 = -Math.PI/2 + (i+1) * 2*Math.PI/n;
  const gross = (a1 - a0) > Math.PI ? 1 : 0;
  const p = (rad, a) => [M + rad*Math.cos(a), M + rad*Math.sin(a)];
  const [x0,y0] = p(RI,a0), [x1,y1] = p(RI,a1);
  const [X0,Y0] = p(r,a0),  [X1,Y1] = p(r,a1);
  return `M${x0} ${y0} L${X0} ${Y0} A${r} ${r} 0 ${gross} 1 ${X1} ${Y1} L${x1} ${y1} `
       + `A${RI} ${RI} 0 ${gross} 0 ${x0} ${y0} Z`;
}

function rad(){
  const n = bereiche.length;
  const ringe = [];
  /* Hilfsringe: bei jedem zweiten Schritt eine feine Linie, damit man beim
     Ausmalen sieht, wo man ist — wie die Ringe auf der gedruckten Vorlage. */
  for (let g = 2; g <= G; g += 2){
    ringe.push(`<circle cx="${M}" cy="${M}" r="${RI + (R-RI)*g/G}" fill="none"
      stroke="var(--line)" stroke-width="1"/>`);
  }
  /* Das frühere Rad als dünne Kontur im selben Bild — nicht als zweites Rad daneben.
     Nur Bereiche, deren Name in beiden Rädern vorkommt; alles andere waere geraten. */
  const alt = (typeof vorher === 'function') ? vorher() : null;
  const kontur = !alt ? '' : bereiche.map((b,i) => {
    const a = alt.bereiche.find(x => x.name === b.name);
    if (!a || a.wert === null) return '';
    const r = RI + (R-RI) * a.wert/G;
    const a0 = -Math.PI/2 + i * 2*Math.PI/n;
    const a1 = -Math.PI/2 + (i+1) * 2*Math.PI/n;
    const p = (rad,w) => [M + rad*Math.cos(w), M + rad*Math.sin(w)];
    const [x0,y0] = p(r,a0), [x1,y1] = p(r,a1);
    const gross = (a1-a0) > Math.PI ? 1 : 0;
    return `<path d="M${x0} ${y0} A${r} ${r} 0 ${gross} 1 ${x1} ${y1}" fill="none"
      stroke="var(--goldl)" stroke-width="1.6" stroke-dasharray="4 3"
      opacity=".85" pointer-events="none"/>`;
  }).join('');

  const segs = bereiche.map((b,i) => {
    const voll = segment(i, n, R);
    const wert = b.wert === null ? 0 : b.wert;
    const r = RI + (R-RI) * wert/G;
    const gefuellt = wert > 0 ? segment(i, n, r) : '';
    return `<path d="${voll}" fill="#00000000" stroke="var(--line)" stroke-width="1.5"/>
      ${gefuellt ? `<path d="${gefuellt}" fill="var(--gold)" fill-opacity=".82"
        stroke="var(--goldl)" stroke-width="1" pointer-events="none"/>` : ''}
      <path class="seg" d="${voll}" fill="#00000000" data-i="${i}"
        role="slider" tabindex="0" aria-label="${esc(b.name)}"
        aria-valuemin="0" aria-valuemax="10" aria-valuenow="${wert}" aria-valuetext="${zahl(wert)}"/>`;
  }).join('');

  /* Beschriftung ausserhalb des Rades.
     🔴 Frank 03.09.2026: "Unternehmerenergie ist nicht voll lesbar." Der Text lief aus
     dem sichtbaren Bereich heraus — die viewBox war so breit wie das Rad, die Labels
     stehen aber daneben. Zwei Konsequenzen: lange Namen werden auf zwei Zeilen
     umgebrochen statt abgeschnitten, und die viewBox wird aus der tatsaechlich
     benoetigten Breite berechnet, statt sie zu raten. */
  const FS = 13;
  const breite = s => s.length * FS * 0.54;      // Naeherung fuer Avenir
  const umbruch = s => {
    if (s.length <= 16) return [s];
    const w = s.split(' ');
    if (w.length === 1) return [s];              // ein langes Wort bleibt ganz
    let a = '', b = '';
    for (const teil of w){
      if (!a || (a + ' ' + teil).length <= 16) a = a ? a + ' ' + teil : teil;
      else b = b ? b + ' ' + teil : teil;
    }
    return b ? [a, b] : [a];
  };

  let xMin = 0, xMax = 2*M, yMin = 0, yMax = 2*M;
  const labels = bereiche.map((b,i) => {
    const a = -Math.PI/2 + (i + .5) * 2*Math.PI/n;
    const x = M + (R+26)*Math.cos(a), y = M + (R+26)*Math.sin(a);
    const anker = Math.abs(Math.cos(a)) < .25 ? 'middle' : (Math.cos(a) > 0 ? 'start' : 'end');
    const zeilen = umbruch(b.name);
    const w = Math.max(...zeilen.map(breite));
    const oben = y - (zeilen.length - 1) * FS * 0.62;
    if (anker === 'start')      xMax = Math.max(xMax, x + w + 8);
    else if (anker === 'end')   xMin = Math.min(xMin, x - w - 8);
    else { xMin = Math.min(xMin, x - w/2 - 8); xMax = Math.max(xMax, x + w/2 + 8); }
    yMin = Math.min(yMin, oben - FS);
    yMax = Math.max(yMax, oben + zeilen.length * FS * 1.24);
    return `<text x="${x}" y="${oben}" text-anchor="${anker}" dominant-baseline="middle"
      fill="var(--dim)" font-size="${FS}" font-family="inherit">${zeilen.map((z,k) =>
      `<tspan x="${x}" dy="${k ? FS*1.24 : 0}">${esc(z)}</tspan>`).join('')}</text>`;
  }).join('');
  const vb = `${xMin} ${yMin} ${xMax - xMin} ${yMax - yMin}`;

  const offen = bereiche.filter(b => b.wert === null).length;
  app.innerHTML = `
  <h2>Schritt 2 von 5</h2>
  <h1>Wie voll ist jeder Bereich?</h1>
  <p>Zieh vom Mittelpunkt nach außen, bis das Stück so voll ist, wie der Bereich
  gerade läuft. <b>Null heißt: läuft extrem schlecht. Zehn heißt: perfekt, kein
  Verbesserungsbedarf.</b> Halbe Schritte sind möglich. Nimm dir Zeit dafür — das Nachdenken ist der Punkt,
  nicht die Zahl.</p>

  <div class="radbox">
    <svg viewBox="${vb}" id="svg">
      ${ringe.join('')}
      ${segs}
      ${kontur}
      <circle cx="${M}" cy="${M}" r="${RI}" fill="var(--bg)" stroke="var(--line)"/>
      ${labels}
    </svg>
  </div>

  ${(typeof vorher === 'function' && vorher()) ? `<p class="hint" style="text-align:center;
    margin-top:-2px">Die gestrichelte Linie ist dein Rad vom ${esc(vorher().datum)}.</p>` : ''}

  <div class="werte">${bereiche.map(b => `
    <div class="wert${b.wert === null ? ' leer' : ''}">
      <span class="z">${b.wert === null ? '–' : zahl(b.wert)}</span>
      <span class="b">${esc(b.name)}</span></div>`).join('')}
  </div>

  <div class="nav">
    <button class="go" ${offen ? 'disabled' : ''} onclick="vtIndex=0;vtIdeen=false;seite=2;render();window.scrollTo(0,0)">Weiter</button>
    <button class="ghost" onclick="seite=0;render()">Bereiche ändern</button>
    <span class="hint">${offen ? `noch ${offen} ohne Wert` : ''}</span>
  </div>`;
  radBedienung();
}

/* Ausmalen: der Winkel bestimmt das Segment, der Abstand den Wert.
   Bewusst kein Regler — die Geste vom Zentrum nach aussen ist dieselbe wie
   auf Papier, und sie dauert lange genug, um dabei nachzudenken. */
function radBedienung(){
  const svg = document.getElementById('svg');
  if (!svg) return;
  let aktiv = null;

  /* Die viewBox ist seit dem Label-Umbruch weder quadratisch noch bei 0/0 verankert —
     die Umrechnung muss Versatz und Massstab daraus lesen, sonst trifft der Klick
     das falsche Segment. */
  const ausSvg = ev => {
    const r = svg.getBoundingClientRect();
    const vb = svg.getAttribute('viewBox').split(/\s+/).map(Number);
    const s = vb[2] / r.width;
    return {x: vb[0] + (ev.clientX - r.left) * s,
            y: vb[1] + (ev.clientY - r.top) * s};
  };
  const setzen = (i, p) => {
    const dx = p.x - M, dy = p.y - M;
    const d = Math.hypot(dx, dy);
    let w = Math.round(G * (d - RI) / (R - RI) / SCHRITT) * SCHRITT;
    w = Math.max(0, Math.min(G, w));
    if (bereiche[i].wert !== w){ bereiche[i].wert = w; rad(); }
  };
  const segVon = p => {
    const n = bereiche.length;
    let a = Math.atan2(p.y - M, p.x - M) + Math.PI/2;
    while (a < 0) a += 2*Math.PI;
    return Math.floor((a % (2*Math.PI)) / (2*Math.PI/n));
  };

  svg.addEventListener('pointerdown', ev => {
    const p = ausSvg(ev);
    if (Math.hypot(p.x-M, p.y-M) < RI) return;   // Nabe ignorieren
    aktiv = segVon(p);
    svg.setPointerCapture(ev.pointerId);
    setzen(aktiv, p);
    ev.preventDefault();
  });
  svg.addEventListener('pointermove', ev => {
    if (aktiv === null) return;
    setzen(aktiv, ausSvg(ev));      // Segment bleibt, nur der Abstand zaehlt
    ev.preventDefault();
  });
  const ende = () => { aktiv = null; };
  svg.addEventListener('pointerup', ende);
  svg.addEventListener('pointercancel', ende);

  /* Tastatur, damit das Rad ohne Maus bedienbar bleibt. */
  svg.querySelectorAll('.seg').forEach(el => {
    el.addEventListener('keydown', ev => {
      const i = +el.dataset.i;
      const jetzt = bereiche[i].wert === null ? 0 : bereiche[i].wert;
      let w = jetzt;
      if (ev.key === 'ArrowUp' || ev.key === 'ArrowRight') w = Math.min(G, jetzt+SCHRITT);
      else if (ev.key === 'ArrowDown' || ev.key === 'ArrowLeft') w = Math.max(0, jetzt-SCHRITT);
      else if (/^[0-9]$/.test(ev.key)) w = +ev.key;
      else return;
      ev.preventDefault();
      bereiche[i].wert = w; rad();
      const neu = document.querySelector(`.seg[data-i="${i}"]`);
      if (neu) neu.focus();
    });
  });
}

/* Abschluss. Bewusst karg: das fertige Rad, die Werte, und der eine Satz, den die
   Methode an dieser Stelle vorsieht — wie rund oder unrund das Rad ist. Auswertung,
   Unterkriterien und Vorjahresvergleich kommen spaeter und gehoeren nicht in den Kern. */
/* ====================== Seite 4: das Ergebnis ======================
   🔴 Frank 04.09.2026: „der Schluss ist wieder zu lang und zu unübersichtlich und ohne
   kurze und klare Empfehlung." Vorher standen fünf Bloecke gleichrangig untereinander —
   Rad, Gefuehl/Rechnung, Krise, 30 Zeilen Zielvorlage, Verlauf. Wer hier ankommt, hat
   eine Stunde gearbeitet und will EINEN Satz, nicht das Material noch einmal.
   Jetzt: das Rad, die Empfehlung, fertig. Alles andere liegt aufklappbar darunter. */
function schwaechster(){
  /* Der Bereich, bei dem es zuerst hakt. Wo eine Rechnung vorliegt, zaehlt sie — sie ist
     begruendet, der gemalte Wert ist nur gefuehlt. Essenzielle Bereiche bekommen den
     Bonus aus prioWert(); dieselbe Regel wie im Abschluss, damit nicht zwei Stellen
     derselben Datei zwei verschiedene Bereiche empfehlen. */
  return bereiche.reduce((a,b) => prioWert(b) < prioWert(a) ? b : a);
}
function empfehlungHtml(){
  const b = schwaechster();
  const st = standort(b);
  const w  = st !== null ? st : b.wert;
  const ess = (ESSENZIELL.find(e => e.id === b.ess) || {}).lang;
  const su = summen(b);
  const lueck = (b.schwer || []).filter(x => (x.text || '').trim());
  const ohne  = lueck.filter(x => !(x.schritt || '').trim())
                     .sort((x,y) => (y.g||0) - (x.g||0));
  const mit   = lueck.filter(x => (x.schritt || '').trim())
                     .sort((x,y) => (y.g||0) - (x.g||0)).slice(0,3);

  const roher = bereiche.reduce((a,c) => wertVon(c) < wertVon(a) ? c : a);
  let grund = `Mit <b>${st !== null ? zahl1(st) : zahl(b.wert)}</b> ist das dein
    schwächster Bereich${ess ? ` — und er deckt <b>${esc(ess)}</b> ab, einen der drei
    essenziellen` : ''}.`;
  if (roher.name !== b.name)
    grund = `Mit <b>${zahl1(w)}</b> steht ${esc(b.name)} zwar über
      ${esc(roher.name)} (${zahl1(wertVon(roher))}) — aber er deckt <b>${esc(ess)}</b> ab,
      einen der drei essenziellen Bereiche, und der andere nicht. Bei diesem Abstand geht
      der essenzielle vor.`;
  if (st !== null && su.h > su.s) grund += ` Er ist der einzige, in dem die Lücken
    schwerer wiegen als die Stärken (${su.h} gegen ${su.s} Punkte).`;

  let tun;
  if (ohne.length >= Math.max(2, lueck.length / 2)){
    tun = `<p><b>Dein nächster Schritt ist, die nächsten Schritte zu finden.</b>
      ${ohne.length} von ${lueck.length} Lücken hier haben noch keinen —
      ausgerechnet die schwersten:</p>
      <ol class="tunl">${ohne.slice(0,3).map(x =>
        `<li>${esc(x.text)} <span>${x.g}</span></li>`).join('')}</ol>
      <p class="hint">Solange dort nichts steht, kommt aus deinem schwächsten Bereich
      kein einziges Ziel heraus — und das ist der Bereich, der die anderen mitzieht.</p>`;
  } else if (mit.length){
    tun = `<p>Die schwersten Schritte, die du dort schon formuliert hast:</p>
      <ol class="tunl">${mit.map(x =>
        `<li>${esc(x.schritt)} <span>${x.g}</span></li>`).join('')}</ol>`;
  } else {
    tun = `<p class="hint">Für diesen Bereich hast du noch keine Lücken aufgeschrieben.
      Dort anzufangen ist der schnellste Weg zu konkreten Zielen.</p>`;
  }

  return `<div class="empf">
    <span class="lb">Empfehlung</span>
    <div class="eh">Fang bei ${esc(b.name)} an.</div>
    <p>${grund}</p>
    ${tun}
  </div>`;
}

function fertig(){
  const w = bereiche.map(b => b.wert);
  const min = Math.min(...w), max = Math.max(...w);
  const spanne = max - min;
  const schwach = bereiche.filter(b => b.wert === min).map(b => b.name);
  const rund = spanne <= 2;
  rad();                                  // Rad neu zeichnen
  const radHtml = app.innerHTML.split('<div class="radbox">')[1].split('</div>')[0];
  const zahlZiele = zielListe().length;
  app.innerHTML = `
  <h2>Schritt 4 von 5 · Dein Rad</h2>
  <h1>${rund ? 'Ein rundes Rad.' : 'Ein unrundes Rad.'}</h1>
  <p>${rund
    ? `Zwischen dem stärksten und dem schwächsten Bereich liegen nur
       <b>${zahl(spanne)} Punkte</b>. Ein rundes Rad rollt — die Frage ist dann weniger,
       wo es hakt, als auf welchem Niveau es rollt.`
    : `Zwischen dem stärksten und dem schwächsten Bereich liegen
       <b>${zahl(spanne)} Punkte</b>. Ein unrundes Rad rollt nicht schlecht, weil ein
       Bereich schwach ist — sondern weil der schwache die anderen mitzieht.`}</p>

  <div class="radbox">${radHtml}</div>

  <div class="werte">${[...bereiche].sort((a,b) => a.wert - b.wert).map(b => `
    <div class="wert"><span class="z">${zahl(b.wert)}</span>
    <span class="b">${esc(b.name)}</span></div>`).join('')}
  </div>

  ${kriseHtml()}

  ${empfehlungHtml()}

  <details class="auf"><summary>Gefühl und Rechnung je Bereich</summary>
    ${gegenHtml()}</details>

  <details class="auf"><summary>Alle Ansätze fürs Zielesetzen${zahlZiele
    ? ` · ${zahlZiele}` : ''}</summary>${zieleHtml()}</details>

  <details class="auf" ${speicherStand() === 'alt' ? 'open' : ''}><summary>Verlauf und
    Speichern${speicherStand() === 'alt' ? ' · <b style="color:var(--goldl)">nicht gespeichert</b>'
    : (speicherStand() === 'aktuell' ? ' · gespeichert' : '')}</summary>${verlaufHtml()}</details>

  <div class="nav">
    <button class="go" onclick="seite=4;render();window.scrollTo(0,0)">Weiter: Reihenfolge
      und Vorsätze</button>
    <button class="ghost" onclick="seite=1;render()">Werte ändern</button>
    <button class="ghost" onclick="vtIndex=0;vtIdeen=false;seite=2;render()">Vertiefung</button>
    <button class="ghost" onclick="seite=0;render()">Bereiche ändern</button>
    ${durchgangNav()}
  </div>`;
}

/* ====================== Seite 5: Reihenfolge und Vorsätze ======================
   🔴 Frank 04.09.2026: „man kann am Ende vielleicht alle Bereiche einmal ranken, um den
   derzeit wichtigsten nach oben zu stellen, dann kann auch Feedback erfolgen, wie
   sinnvoll das Ranking ist (essenzielle immer höhere Prio)."
   Damit hört das Rad nicht bei einer Diagnose auf, sondern bei einer Entscheidung.

   Zum Feedback: 🔴 in dieser Datei läuft KEIN Modell. Sie ist offline, ohne Server und
   ohne Schlüssel — genau deshalb läuft sie überall und die Daten gehen nirgends hin.
   Das Feedback sind feste Regeln aus der Methode. Für ein Instrument ist das besser als
   ein Modell: es ist reproduzierbar, und es spricht die Methode, nicht eine Meinung.

   🔴 Die Prioritätsregel, von Frank am 04.09.2026 entschieden: essenzielle Bereiche
   bekommen 1,5 Punkte gutgeschrieben, danach zählt nur der Wert. „Essenziell immer
   zuerst" wäre hart falsch, wenn ein nicht-essenzieller bei 2 steht und ein essenzieller
   bei 8; ohne Bonus verliert die Unterscheidung ihren Sinn. Bei Frank stehen
   Unternehmerenergie 4,4 (nicht essenziell) gegen Gesundheit 5,8 (essenziell) —
   Abstand 1,4, also Gesundheit knapp zuerst. */
const ESS_BONUS = 1.5;

function wertVon(b){ const st = standort(b); return st !== null ? st : b.wert; }
function prioWert(b){ return wertVon(b) - (b.ess ? ESS_BONUS : 0); }

/* Die Reihenfolge liegt in b.rang, NICHT in der Reihenfolge von `bereiche` — die
   bestimmt die Segmente im Rad und darf sich nicht verschieben. */
function raenge(){
  const r = [...bereiche];
  if (r.some(b => typeof b.rang !== 'number'))
    r.forEach((b,i) => { if (typeof b.rang !== 'number') b.rang = i; });
  return r.sort((a,b) => a.rang - b.rang);
}
function schieben(name, um){
  const r = raenge();
  const i = r.findIndex(b => b.name === name);
  const j = i + um;
  if (i < 0 || j < 0 || j >= r.length) return;
  [r[i], r[j]] = [r[j], r[i]];
  r.forEach((b,k) => b.rang = k);
  render(); entwurfMerken();
}
function rangVorschlag(){
  [...bereiche].sort((a,b) => prioWert(a) - prioWert(b))
    .forEach((b,i) => b.rang = i);
  render(); entwurfMerken();
}

/* Regeln, in der Reihenfolge ihrer Schwere. Jede prueft eine Sache und sagt sie
   in einem Satz — keine Punktzahl fuer das Ranking, die waere erfunden. */
function rangFeedback(){
  const r = raenge();
  const erste = r[0];
  const soll = [...bereiche].sort((a,b) => prioWert(a) - prioWert(b))[0];
  const werte = bereiche.map(wertVon);
  const schnitt = werte.reduce((a,b) => a+b, 0) / werte.length;
  const krise = bereiche.filter(b => b.ess && b.wert < KRISE_UNTER);
  const schwer8 = b => (b.schwer || []).filter(x => (x.g || 0) >= 8).length;
  const out = [];

  if (krise.length >= 2){
    out.push({art:'rot', t:`<b>${krise.map(b => esc(b.name)).join(' und ')}</b> liegen
      unter ${KRISE_UNTER} und decken essenzielle Bereiche ab. Solange das so ist, ist die
      Reihenfolge der übrigen zweitrangig — die Methode nennt genau diese Lage eine
      Lebenskrise.`});
  }

  if (erste.name === soll.name){
    /* Nicht „am schwaechsten" schreiben, wenn der Bonus entschieden hat — dann steht
       ein anderer Bereich tiefer, und der Satz waere schlicht falsch. */
    const roh = [...bereiche].sort((a,b) => wertVon(a) - wertVon(b))[0];
    out.push({art:'gruen', t: roh.name === erste.name
      ? `<b>Platz 1 sitzt.</b> ${esc(erste.name)} steht mit
        <b>${zahl1(wertVon(erste))}</b> am schwächsten${erste.ess
        ? ' und deckt einen der drei essenziellen Bereiche ab' : ''} — das ist der Bereich,
        der die anderen mitzieht.`
      : `<b>Platz 1 sitzt.</b> ${esc(erste.name)} steht mit
        <b>${zahl1(wertVon(erste))}</b> zwar über ${esc(roh.name)}
        (${zahl1(wertVon(roh))}), deckt aber einen der drei essenziellen Bereiche ab —
        und bei diesem Abstand geht der essenzielle vor.`});
  } else {
    out.push({art:'gold', t:`Du hast <b>${esc(erste.name)}</b>
      (${zahl1(wertVon(erste))}) vorangestellt. Nach der Methode käme
      <b>${esc(soll.name)}</b> (${zahl1(wertVon(soll))}) zuerst${soll.ess && !erste.ess
      ? ' — der deckt einen der drei essenziellen Bereiche ab, deiner nicht' : ''}.
      Das ist kein Fehler: du kennst Gründe, die keine Zahl kennt. Aber es sollte einer sein.`});
  }

  if (wertVon(erste) > schnitt){
    out.push({art:'gold', t:`<b>Du arbeitest am Starken.</b> ${esc(erste.name)} liegt
      mit ${zahl1(wertVon(erste))} über dem Schnitt deiner Bereiche
      (${zahl1(schnitt)}). Der Aufwand dort zahlt am wenigsten ein — das Rad rollt nicht
      runder, wenn der volle Bereich noch voller wird.`});
  }

  /* Ein essenzieller Bereich unter dem Schnitt, aber in der unteren Haelfte einsortiert. */
  const unten = r.slice(Math.ceil(r.length/2))
    .filter(b => b.ess && wertVon(b) < schnitt);
  if (unten.length){
    out.push({art:'gold', t:`${unten.map(b => `<b>${esc(b.name)}</b>`).join(' und ')}
      ${unten.length === 1
        ? 'steht unter dem Schnitt und deckt einen der drei essenziellen Bereiche ab'
        : 'stehen unter dem Schnitt und decken essenzielle Bereiche ab'} — trotzdem
      in der hinteren Hälfte. „X ist nicht alles, aber ohne X ist alles nichts" gilt für
      alle drei.`});
  }

  /* Wo die schwersten Luecken liegen — unabhaengig vom Wert. */
  const dicht = [...bereiche].sort((a,b) => schwer8(b) - schwer8(a))[0];
  if (schwer8(dicht) >= 3 && raenge().findIndex(b => b.name === dicht.name) >= r.length/2){
    out.push({art:'gold', t:`<b>${esc(dicht.name)}</b> hat ${schwer8(dicht)} Lücken mit
      Gewicht 8 oder mehr — mehr als jeder andere Bereich — steht bei dir aber auf
      Platz ${raenge().findIndex(b => b.name === dicht.name)+1}.`});
  }

  return out;
}

/* Die Auswahl haengt am Eintrag selbst, damit sie mit ins Rad gespeichert wird und
   beim naechsten Mal dasteht: „das hattest du dir vorgenommen". */
function vorsatz(i, an){
  const x = zielListe()[i];
  if (!x || !x.ref) return;
  if (an && zielListe().filter(y => y.vor).length >= 5 && !x.ref.vor){
    alert('Fünf sind genug. Nimm erst eines weg.');
    render(); return;
  }
  x.ref.vor = an;
  render(); entwurfMerken();
}
function vorsaetzeExport(){

/* ====================== Die Zielvorlage ======================
   🔴 Frank 04.09.2026: „die Differenz daraus ergeben dann quasi die Ziele, die perfekte
   Vorbereitung zum Ziele setzen." Genau das steht hier: nicht die Differenz als Zahl,
   sondern die naechsten Schritte, die dabei entstanden sind — nach Gewicht sortiert,
   die schwerste Herausforderung zuerst. Das Lebensrad hoert damit nicht bei einer
   Diagnose auf, sondern legt die Zielsetzung fertig vorbereitet daneben.
   Gesetzt werden die Ziele trotzdem woanders. Das Rad liefert die Basis, nicht die Wahl. */
function zielListe(){
  const p = [];
  bereiche.forEach(b => {
    (b.schwer || []).forEach(x => {
      if ((x.schritt || '').trim() || (x.loesung || '').trim())
        p.push({bereich:b.name, g:x.g, art:'Lücke', was:x.text, ref:x, vor:!!x.vor,
                ziel:(x.loesung || '').trim(), schritt:(x.schritt || '').trim()});
    });
    (b.stark || []).forEach(x => {
      if ((x.ausbau || '').trim())
        p.push({bereich:b.name, g:x.g, art:'Ausbau', was:x.text, ref:x, vor:!!x.vor,
                ziel:'', schritt:x.ausbau.trim()});
    });
  });
  p.sort((a,b) => a.art !== b.art ? (a.art === 'Lücke' ? -1 : 1) : b.g - a.g);
  return p;
}
function zieleHtml(){
  const p = zielListe();
  let h = '';
  if (!p.length){
    return h + `<p>Hier stehen später deine nächsten Schritte — sie entstehen in der
      Vertiefung, in den Feldern <i>nächster Schritt</i> und <i>wie wird mehr daraus</i>.
      Bisher ist keines davon ausgefüllt.</p>`;
  }
  const l = p.filter(x => x.art === 'Lücke').length;
  h += `<p><b>${p.length} Ansätze</b>, ${l} davon aus den Lücken zwischen deinen 100 %
    und heute, ${p.length - l} aus dem Ausbau dessen, was schon läuft. Die schwersten
    stehen oben. <b>Das sind noch keine Ziele</b> — es ist das Material, aus dem du
    welche formulierst, und du entscheidest, welche.</p>
    <table class="tab">
      <tr><th>Bereich</th><th>Woran es liegt</th><th>Nächster Schritt</th><th>Gewicht</th></tr>
      ${p.map(x => `<tr>
        <td>${esc(x.bereich)}<br><span class="hint">${x.art}</span></td>
        <td>${esc(x.was)}${x.ziel ? `<br><span class="hint">gelöst: ${esc(x.ziel)}</span>` : ''}</td>
        <td>${esc(x.schritt) || '<span class="hint">— offen</span>'}</td>
        <td class="g">${x.g}</td></tr>`).join('')}
    </table>
    <div class="nav" style="margin-top:4px">
      <button class="ghost" onclick="zieleExport()">Als Textdatei sichern</button>
    </div>`;
  return h;
}
